kind: Service
apiVersion: v1
metadata:
  name: test-dk-kubemon
  namespace: dynatrace
  labels:
    app.kubernetes.io/instance: test-dk
    app.kubernetes.io/managed-by: dynatrace-operator
    app.kubernetes.io/name: kubemon
    internal.dynatrace.com/operator-version: snapshot
  ownerReferences:
  - apiVersion: dynatrace.com/v1beta6
    blockOwnerDeletion: true
    controller: true
    kind: DynaKube
    name: test-dk
    uid: ""
spec:
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: https
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: test-dk
    app.kubernetes.io/managed-by: dynatrace-operator
    app.kubernetes.io/name: kubemon
  type: ClusterIP
status:
  loadBalancer: {}
