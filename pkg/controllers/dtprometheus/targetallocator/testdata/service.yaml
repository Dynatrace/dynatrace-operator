kind: Service
apiVersion: v1
metadata:
  name: dtp-target-allocator
  namespace: dynatrace
  labels:
    app.kubernetes.io/component: otel-allocator
    app.kubernetes.io/created-by: dtp
    app.kubernetes.io/managed-by: dynatrace-operator
    app.kubernetes.io/name: opentelemetry-target-allocator
    app.kubernetes.io/version: ""
  ownerReferences:
  - apiVersion: dynatrace.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: DTPrometheus
    name: dtp
    uid: dtp-uid
spec:
  ports:
  - name: https-port
    port: 443
    protocol: TCP
    targetPort: https-port
  - name: http-port
    port: 80
    protocol: TCP
    targetPort: http-port
  selector:
    app.kubernetes.io/created-by: dtp
    app.kubernetes.io/managed-by: dynatrace-operator
    app.kubernetes.io/name: opentelemetry-target-allocator
status:
  loadBalancer: {}
