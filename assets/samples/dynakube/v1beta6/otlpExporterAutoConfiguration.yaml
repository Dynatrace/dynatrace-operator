apiVersion: dynatrace.com/v1beta6
kind: DynaKube
metadata:
  name: dynakube
  namespace: dynatrace

spec:
  # Link to api reference for further information: https://docs.dynatrace.com/docs/ingest-from/setup-on-k8s/reference/dynakube-parameters

  # Required: Dynatrace apiUrl including the `/api` path at the end.
  apiUrl: https://ENVIRONMENTID.live.dynatrace.com/api

  # Optional: Enable self-monitoring. Deploy an OTEL collector that is configured for ingesting Dynatrace Operator component metrics.
  selfMonitoring: {}
    # Optional: Set the Deployment replicas. Leave this empty to allow external controllers like HPA to manage replicas. If unset, uses Kubernetes default.
    #
    # replicas: 1

    # Optional: Set custom Deployment rollout strategy. If unset, uses Kubernetes default.
    #
    # strategy:
    #   rollingUpdate:
    #     maxSurge: 25%
    #     maxUnavailable: 25%
    #   type: RollingUpdate
    #
    # Optional: Set additional pod labels.
    #
    # labels: {}

    # Optional: Set additional pod annotations.
    #
    # annotations: {}

    # Optional: Define a node selector.
    #
    # nodeSelector: {}

    # Optional: Define pod affinity.
    #
    # affinity: {}

    # Optional: Define pod tolerations.
    #
    # tolerations: []

    # Optional: Define pod topology spread constraints.
    #
    # topologySpreadConstraints: []

    # Optional: Set a pod priority class.
    #
    # priorityClassName: high-priority

    # Optional: Define pod volumes. Only allows volumes of type emptyDir, configMap, secret or projected.
    #
    # volumes: []

    # Optional: Specify an image for the OTEL collector. If unset, the image will be fetched using the fleet management API.
    #
    # image: public.ecr.aws/dynatrace/dynatrace-otel-collector:<tag>

    # Optional: Set an image pull policy. If unset, uses Kubernetes default.
    #
    # imagePullPolicy: IfNotPresent

    # Optional: Set additional command-line arguments for the OTEL collector container.
    #
    # args: []

    # Optional: Override default container resources.
    #
    # resources:
    #   requests:
    #     cpu: 100m
    #     requests: 256Mi

    # Optional: Define container volume mounts. Must match provides pod volume names.
    #
    # volumeMounts: []

  # Optional: Name of the secret holding the tokens used for connecting to Dynatrace.
  #
  # tokens: ""

  # Optional: Defines a custom pull secret in case you use a private registry when pulling images from the Dynatrace environment
  #
  # customPullSecret: "custom-pull-secret"

  # Optional: Disable certificate check for the connection between Dynatrace Operator and the Dynatrace Cluster.
  #
  # skipCertCheck: false

  # Optional: Set custom proxy settings either directly or from a secret with the field 'proxy'
  #
  # proxy:
  #   value: my-proxy-url.com
  #   valueFrom: name-of-my-proxy-secret

  # Optional: Add custom RootCAs from a configmap.
  #
  # trustedCAs: name-of-my-ca-configmap

  # Optional: Set a network zone for the OneAgent and ActiveGate pods.
  #
  # networkZone: name-of-my-network-zone

  # Optional: Configure istio to allow access to the Dynatrace Cluster from the OneAgent or ActiveGate pods.
  #
  # enableIstio: true

  # Optional: Minimum minutes between Dynatrace API requests.
  #
  # dynatraceApiRequestThreshold: 15

  # Enable automatic configuration of the OTLP exporter in applications that are instrumented with OpenTelemetry SDKs.
  # Without a local in-cluster ActiveGate ingested data is sent directly to your tenant.
  otlpExporterConfiguration:

    # Configure for which signals the OTLP exporter configuration should be automatically injected.
    signals:
      metrics: {}
      traces: {}
      logs: {}

      # Optional: The namespaces where you want Dynatrace Operator to inject the OTLP exporter configuration.
      #
      # namespaceSelector:
      #   matchLabels:
      #     app: my-app
      #   matchExpressions:
      #   - key: app
      #     operator: In
      #     values: [my-frontend, my-backend, my-database]

      # Optional: Override OTLP configuration environment variables in case they are already set in the application pods.
      # overrideEnvVars: true
