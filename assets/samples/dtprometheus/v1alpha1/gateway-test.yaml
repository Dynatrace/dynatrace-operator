        memory: 4Gi
    replicas: 3
  logMonitoring: {}
---
# DTPrometheus — gateway fleet only (tier 2 reconciler under test).
# References gke-k8s-2026-07-27 for apiUrl + tokens.
# Tier 1 (scraper + target allocator) omitted; send test metrics directly
# to a gateway pod's port 4317 to verify the OTel pipeline.
apiVersion: dynatrace.com/v1alpha1
kind: DTPrometheus
metadata:
  name: prom-gw
  namespace: dynatrace
spec:
  dynaKubeName: gke-k8s-2026-07-27

  gateway:
    # Fleet API has no gateway component for this tenant; image must be pinned.
    image: ghcr.io/dynatrace/dynatrace-otel-collector/dynatrace-otel-collector:0.51.0
    replicas: 2

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
