# In-cluster test manifest for the gateway fleet (tier 2 only).
# Copied from dynakube (22).yaml; DTPrometheus added below.
#
# Apply:
#   kubectl apply -f assets/samples/dtprometheus/v1alpha1/gateway-test.yaml
#
# Verify:
#   kubectl get cm,sts,svc -l app.kubernetes.io/name=opentelemetry-gateway -n dynatrace
#   kubectl get pods -n dynatrace -l app.kubernetes.io/name=opentelemetry-gateway
#   kubectl exec -n dynatrace <pod> -- curl -s http://localhost:13133/
#   kubectl logs -n dynatrace <pod>
---
apiVersion: v1
data:
  apiToken: ZHQwczE2LkJRVlhMWko2Lk00SjdPSFFGUlM1VzJYSDdCREkzT1pNSU5OQzZYM1RBUUdGVlpENVRBS0RQU1AzR0hNN1hGVDVYTVZDQUJENzI=
  dataIngestToken: ZHQwczE2LkFWM1lPSkxKLllINTJJT1RPTkM2NkczVllYSDVFSVJQTFQ1N0ZZRFdLVVIzSExINlE2Ujc2NDNJT1lKRFczNUVaR01RU0pMUlU=
