suite: test logmonitoring clusterrole
templates:
  - Common/logmonitoring/clusterrole-logmonitoring.yaml
tests:
  - it: logmonitoring ClusterRole should use nodes/pods by default on k8s >= 1.36 (auto-detected)
    capabilities:
      majorVersion: 1
      minorVersion: 36
    set:
      rbac.logMonitoring.create: true
      rbac.oneagent.create: false
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/pods
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/proxy
            verbs:
              - get
  - it: logmonitoring ClusterRole should use nodes/pods on k8s 1.36 with GKE prerelease suffix
    capabilities:
      majorVersion: 1
      minorVersion: 36.1-gke.1495002
    set:
      rbac.logMonitoring.create: true
      rbac.oneagent.create: false
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/pods
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/proxy
            verbs:
              - get
  - it: logmonitoring ClusterRole should use nodes/proxy on k8s 1.36 with a non-GKE prerelease suffix
    capabilities:
      majorVersion: 1
      minorVersion: 36.0-rc.1
    set:
      rbac.logMonitoring.create: true
      rbac.oneagent.create: false
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/proxy
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/pods
            verbs:
              - get
  - it: logmonitoring ClusterRole should use nodes/proxy by default on k8s < 1.36 (no KubeletFineGrainedAuthz override)
    capabilities:
      majorVersion: 1
      minorVersion: 35
    set:
      rbac.logMonitoring.create: true
      rbac.oneagent.create: false
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: dynatrace-logmonitoring
      - isNotEmpty:
          path: metadata.labels
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/proxy
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/pods
            verbs:
              - get
  - it: logmonitoring ClusterRole should use nodes/proxy without KubeletFineGrainedAuthz
    set:
      rbac.logMonitoring.create: true
      rbac.oneagent.create: false
      rbac.kubeletFineGrainedAuthz: false
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: dynatrace-logmonitoring
      - isNotEmpty:
          path: metadata.labels
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/proxy
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/pods
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - security.openshift.io
            resourceNames:
              - privileged
            resources:
              - securitycontextconstraints
            verbs:
              - use
  - it: logmonitoring ClusterRole should use nodes/pods with KubeletFineGrainedAuthz
    set:
      rbac.logMonitoring.create: true
      rbac.oneagent.create: false
      rbac.kubeletFineGrainedAuthz: true
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: dynatrace-logmonitoring
      - isNotEmpty:
          path: metadata.labels
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/pods
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/proxy
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - security.openshift.io
            resourceNames:
              - privileged
            resources:
              - securitycontextconstraints
            verbs:
              - use
  - it: logmonitoring ClusterRoleBinding should exist
    documentIndex: 1
    set:
      rbac.logMonitoring.create: true
      rbac.oneagent.create: false
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: dynatrace-logmonitoring
      - isNotEmpty:
          path: metadata.labels
  - it: extra binding should exist for fullstack
    documentIndex: 2
    set:
      rbac.logMonitoring.create: true
      rbac.oneagent.create: true
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: dynatrace-logmonitoring-fullstack
      - isNotEmpty:
          path: metadata.labels
  - it: shouldn't exist if turned off
    set:
      rbac.logMonitoring.create: false
      rbac.oneagent.create: true
    asserts:
      - hasDocuments:
          count: 0
  - it: logmonitoring ClusterRole should exist on openshift
    set:
      rbac.logMonitoring.create: true
      rbac.oneagent.create: false
      platform: openshift
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: dynatrace-logmonitoring
      - isNotEmpty:
          path: metadata.labels
      - contains:
          path: rules
          content:
            apiGroups:
              - security.openshift.io
            resourceNames:
              - privileged
            resources:
              - securitycontextconstraints
            verbs:
              - use
