suite: test service of webhook
templates:
  - Common/webhook/service.yaml
tests:
  - it: should exist
    set:
      platform: kubernetes
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: dynatrace-webhook
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotEmpty:
          path: metadata.labels
      - equal:
          path: spec.ports
          value:
            - port: 443
              protocol: TCP
              targetPort: server-port
      - isNotEmpty:
          path: spec.selector

  - it: should not have annotations by default
    set:
      platform: kubernetes
    asserts:
      - isKind:
          of: Service
      - notExists:
          path: metadata.annotations

  - it: should take custom annotations
    set:
      platform: kubernetes
      webhook.annotations:
        testKey: testValue
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.annotations
          value:
            testKey: testValue
            service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      - isNotEmpty:
          path: metadata.labels
