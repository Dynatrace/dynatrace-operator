suite: test serviceaccount for dynatrace operator
templates:
  - Common/operator/serviceaccount-operator.yaml
tests:
  - it: should exist
    set:
      platform: kubernetes
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: dynatrace-operator
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotEmpty:
          path: metadata.labels

  - it: should exist
    set:
      platform: openshift
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: dynatrace-operator
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotEmpty:
          path: metadata.labels

  - it: should add user annotations
    set:
      rbac.operator.annotations:
        test: test
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations
          value:
            test: test

