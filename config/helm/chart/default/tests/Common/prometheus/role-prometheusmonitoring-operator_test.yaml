suite: test Role and RoleBinding for PrometheusMonitoring operator
templates:
  - Common/prometheus/role-prometheusmonitoring-operator.yaml
tests:
  - it: Role should exist with correct verbs and resources
    documentIndex: 0
    set:
      experimental.enablePrometheus: true
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: dynatrace-prometheusmonitoring-operator
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotEmpty:
          path: metadata.labels
      - equal:
          path: rules
          value:
            - apiGroups:
                - dynatrace.com
              resources:
                - prometheusmonitorings
              verbs:
                - get
                - list
                - update
                - watch
            - apiGroups:
                - dynatrace.com
              resources:
                - prometheusmonitorings/finalizers
              verbs:
                - update
            - apiGroups:
                - dynatrace.com
              resources:
                - prometheusmonitorings/status
              verbs:
                - patch

  - it: RoleBinding should exist with correct subjects and roleRef
    documentIndex: 1
    set:
      experimental.enablePrometheus: true
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: dynatrace-prometheusmonitoring-operator
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotEmpty:
          path: metadata.labels
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: dynatrace-operator
      - equal:
          path: roleRef
          value:
            kind: Role
            name: dynatrace-prometheusmonitoring-operator
            apiGroup: rbac.authorization.k8s.io

  - it: shouldn't exist if prometheus rbac is turned off
    set:
      rbac.prometheus.create: false
      experimental.enablePrometheus: true
    asserts:
      - hasDocuments:
          count: 0

  - it: shouldn't exist if experimental.enablePrometheus is off
    set:
      experimental.enablePrometheus: false
    asserts:
      - hasDocuments:
          count: 0
