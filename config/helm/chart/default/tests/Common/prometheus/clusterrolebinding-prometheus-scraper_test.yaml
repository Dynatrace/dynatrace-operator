suite: test ClusterRoleBinding for prometheus scraper
templates:
  - Common/prometheus/clusterrolebinding-prometheus-scraper.yaml
tests:
  - it: should exist with correct name and labels
    set:
      experimental.enablePrometheus: true
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: dynatrace-prometheus-scraper
      - isNotEmpty:
          path: metadata.labels

  - it: should reference the correct ClusterRole
    set:
      experimental.enablePrometheus: true
    asserts:
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: dynatrace-prometheus-scraper

  - it: should reference the correct ServiceAccount
    set:
      experimental.enablePrometheus: true
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: dynatrace-prometheus-scraper
            namespace: NAMESPACE

  - it: shouldn't exist if prometheus rbac is turned off
    set:
      rbac.prometheus.create: false
      experimental.enablePrometheus: true
    asserts:
      - hasDocuments:
          count: 0

  - it: shouldn't exist if experimental.enablePrometheus is off
    set:
      experimental.enablePrometheus: false
    asserts:
      - hasDocuments:
          count: 0
