suite: test ServiceAccount for prometheus gateway
templates:
  - Common/prometheus/serviceaccount-prometheus-gateway.yaml
tests:
  - it: should exist
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: dynatrace-prometheus-gateway
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotEmpty:
          path: metadata.labels

  - it: shouldn't exist if prometheus rbac is turned off
    set:
      rbac.prometheus.create: false
    asserts:
      - hasDocuments:
          count: 0
