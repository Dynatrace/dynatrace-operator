suite: test ClusterRole and ClusterRoleBinding for DtPrometheus operator
templates:
  - Common/prometheus/clusterrole-dtprometheus-operator.yaml
tests:
  - it: ClusterRole should exist with correct verbs and resourceNames
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: dynatrace-dtprometheus-operator
      - isNotEmpty:
          path: metadata.labels
      - equal:
          path: rules
          value:
            - apiGroups:
                - apiextensions.k8s.io
              resources:
                - customresourcedefinitions
                - customresourcedefinitions/status
              resourceNames:
                - dtprometheuses.dynatrace.com
              verbs:
                - get
                - update

  - it: ClusterRoleBinding should exist with correct subjects and roleRef
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: dynatrace-dtprometheus-operator
      - isNotEmpty:
          path: metadata.labels
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: dynatrace-operator
            namespace: NAMESPACE
      - equal:
          path: roleRef
          value:
            kind: ClusterRole
            name: dynatrace-dtprometheus-operator
            apiGroup: rbac.authorization.k8s.io

  - it: shouldn't exist if prometheus rbac is turned off
    set:
      rbac.prometheus.create: false
    asserts:
      - hasDocuments:
          count: 0
