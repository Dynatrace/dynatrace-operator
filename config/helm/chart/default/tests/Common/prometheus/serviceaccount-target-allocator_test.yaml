suite: test ServiceAccount for target allocator
templates:
  - Common/prometheus/serviceaccount-target-allocator.yaml
tests:
  - it: should exist
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: dynatrace-target-allocator
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotEmpty:
          path: metadata.labels

  - it: shouldn't exist if prometheus rbac is turned off
    set:
      rbac.prometheus.create: false
    asserts:
      - hasDocuments:
          count: 0
