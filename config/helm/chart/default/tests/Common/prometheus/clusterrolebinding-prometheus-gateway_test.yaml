suite: test ClusterRoleBinding for prometheus gateway
templates:
  - Common/prometheus/clusterrolebinding-prometheus-gateway.yaml
tests:
  - it: should exist with correct name and labels
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: dynatrace-prometheus-gateway
      - isNotEmpty:
          path: metadata.labels

  - it: should reference the correct ClusterRole
    asserts:
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: dynatrace-prometheus-gateway

  - it: should reference the correct ServiceAccount
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: dynatrace-prometheus-gateway
            namespace: NAMESPACE

  - it: shouldn't exist if prometheus rbac is turned off
    set:
      rbac.prometheus.create: false
    asserts:
      - hasDocuments:
          count: 0
