suite: test ClusterRole for prometheus scraper
templates:
  - Common/prometheus/clusterrole-prometheus-scraper.yaml
tests:
  - it: should exist with correct name and labels
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: dynatrace-prometheus-scraper
      - isNotEmpty:
          path: metadata.labels

  - it: should have correct core permissions
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
              - endpoints
              - services
              - namespaces
              - nodes
            verbs:
              - get
              - list
              - watch

  - it: should have apps permissions
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - replicasets
              - deployments
              - statefulsets
              - daemonsets
            verbs:
              - get
              - list
              - watch

  - it: should have batch permissions
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - batch
            resources:
              - jobs
              - cronjobs
            verbs:
              - get
              - list
              - watch

  - it: should have OpenShift SCC permission on openshift platform
    set:
      platform: openshift
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - security.openshift.io
            resourceNames:
              - nonroot-v2
            resources:
              - securitycontextconstraints
            verbs:
              - use

  - it: shouldn't have OpenShift SCC permission on default platform
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - security.openshift.io
            resourceNames:
              - nonroot-v2
            resources:
              - securitycontextconstraints
            verbs:
              - use

  - it: shouldn't exist if prometheus rbac is turned off
    set:
      rbac.prometheus.create: false
    asserts:
      - hasDocuments:
          count: 0
