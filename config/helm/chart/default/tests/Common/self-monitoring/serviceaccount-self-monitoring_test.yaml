suite: test serviceaccount for self-monitoring
templates:
  - Common/self-monitoring/serviceaccount-self-monitoring.yaml
tests:
  - it: should exist
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: dynatrace-self-monitoring
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotEmpty:
          path: metadata.labels
  - it: should have annotations
    set:
      rbac.selfMonitoring.annotations:
        test: test
    asserts:
      - equal:
          path: metadata.annotations
          value:
            test: test
  - it: shouldn't exist if turned off
    set:
      rbac.selfMonitoring.create: false
    asserts:
      - hasDocuments:
          count: 0
