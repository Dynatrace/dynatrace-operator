suite: test clusterrole for self-monitoring
templates:
  - Common/self-monitoring/clusterrole-self-monitoring.yaml
tests:
  - it: ClusterRole and ClusterRoleBinding exist
    asserts:
      - hasDocuments:
          count: 2
  - it: ClusterRole has correct permissions
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: dynatrace-self-monitoring
      - isNotEmpty:
          path: metadata.labels
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - namespaces
                - nodes
              verbs:
                - get
                - list
                - watch
  - it: should have OpenShift SCC permission on openshift platform
    documentIndex: 0
    set:
      platform: openshift
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - security.openshift.io
            resourceNames:
              - nonroot-v2
            resources:
              - securitycontextconstraints
            verbs:
              - use
  - it: shouldn't have OpenShift SCC permission on default platform
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - security.openshift.io
            resourceNames:
              - nonroot-v2
            resources:
              - securitycontextconstraints
            verbs:
              - use
  - it: ClusterRoleBinding binds the service account
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: dynatrace-self-monitoring
      - equal:
          path: roleRef.name
          value: dynatrace-self-monitoring
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: dynatrace-self-monitoring
              namespace: NAMESPACE
  - it: shouldn't exist if turned off
    set:
      rbac.selfMonitoring.create: false
    asserts:
      - hasDocuments:
          count: 0
