suite: test DtPrometheus CRD deployment
templates:
  - Common/crd/dynatrace-operator-dtprometheus-crd.yaml
tests:
  - it: DtPrometheus CRD should render when installCRD is true
    set:
      installCRD: true
      experimental.enablePrometheus: true
    documentIndex: 0
    asserts:
      - isKind:
          of: CustomResourceDefinition
      - equal:
          path: metadata.name
          value: dtprometheuses.dynatrace.com

  - it: CRDs should be absent when installCRD is false
    set:
      installCRD: false
      experimental.enablePrometheus: true
    asserts:
      - hasDocuments:
          count: 0

  - it: DtPrometheus CRD should be absent with default values
    asserts:
      - hasDocuments:
          count: 0
