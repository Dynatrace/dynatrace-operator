suite: test Dynatrace Operator CRD deployment
templates:
  - Common/crd/dynatrace-operator-crd.yaml
tests:
  - it: PrometheusMonitoring CRD should render when installCRD is true
    set:
      installCRD: true
    documentSelector:
      path: metadata.name
      value: prometheusmonitorings.dynatrace.com
    asserts:
      - isKind:
          of: CustomResourceDefinition

  - it: CRDs should be absent when installCRD is false
    set:
      installCRD: false
    asserts:
      - hasDocuments:
          count: 0
