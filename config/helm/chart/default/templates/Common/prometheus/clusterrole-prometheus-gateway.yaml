{{- if and .Values.rbac.prometheus.create (.Values.experimental).enablePrometheus }}
# Copyright Dynatrace LLC
# SPDX-License-Identifier: Apache-2.0
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dynatrace-prometheus-gateway
  labels:
    {{- include "dynatrace-operator.gatewayLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  {{- if (include "dynatrace-operator.openshiftOrOlm" .) }}
  - apiGroups: ["security.openshift.io"]
    resourceNames: ["nonroot-v2"]
    resources: ["securitycontextconstraints"]
    verbs: ["use"]
  {{- end }}
{{- end }}
