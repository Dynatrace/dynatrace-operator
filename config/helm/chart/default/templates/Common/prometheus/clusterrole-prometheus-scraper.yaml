{{- if .Values.rbac.prometheus.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dynatrace-prometheus-scraper
  labels:
    {{- include "dynatrace-operator.scraperLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  {{- if (include "dynatrace-operator.openshiftOrOlm" .) }}
  - apiGroups: ["security.openshift.io"]
    resourceNames: ["nonroot-v2"]
    resources: ["securitycontextconstraints"]
    verbs: ["use"]
  {{- end }}
{{- end }}
