{{- if and .Values.rbac.prometheus.create (.Values.experimental).enablePrometheus }}
# Copyright Dynatrace LLC
# SPDX-License-Identifier: Apache-2.0
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dynatrace-prometheusmonitoring-operator
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "dynatrace-operator.operatorLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - dynatrace.com
    resources:
      - prometheusmonitorings
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - dynatrace.com
    resources:
      - prometheusmonitorings/finalizers
    verbs:
      - update
  - apiGroups:
      - dynatrace.com
    resources:
      - prometheusmonitorings/status
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dynatrace-prometheusmonitoring-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dynatrace-operator.operatorLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: dynatrace-operator
roleRef:
  kind: Role
  name: dynatrace-prometheusmonitoring-operator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
