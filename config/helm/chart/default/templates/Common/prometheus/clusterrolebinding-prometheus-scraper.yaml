apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dynatrace-prometheus-scraper
  labels:
    {{- include "dynatrace-operator.scraperLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dynatrace-prometheus-scraper
subjects:
  - kind: ServiceAccount
    name: dynatrace-prometheus-scraper
    namespace: {{ .Release.Namespace }}
{{- end }}
