{{- if .Values.rbac.selfMonitoring.create }}
# Copyright Dynatrace LLC
# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dynatrace-self-monitoring
  namespace: {{ .Release.Namespace }}
  {{- if .Values.rbac.selfMonitoring.annotations }}
  annotations:
    {{- toYaml .Values.rbac.selfMonitoring.annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "dynatrace-operator.selfMonitoringLabels" . | nindent 4 }}
{{ end }}
