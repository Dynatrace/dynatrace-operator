{{- if .Values.rbac.selfMonitoring.create }}
# Copyright Dynatrace LLC
# SPDX-License-Identifier: Apache-2.0
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dynatrace-self-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dynatrace-operator.selfMonitoringLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dynatrace-self-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dynatrace-operator.selfMonitoringLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dynatrace-self-monitoring
subjects:
  - kind: ServiceAccount
    name: dynatrace-self-monitoring
    namespace: {{ .Release.Namespace }}
{{ end }}
