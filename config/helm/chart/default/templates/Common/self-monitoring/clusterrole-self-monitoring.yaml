{{- if .Values.rbac.selfMonitoring.create }}
# Copyright Dynatrace LLC
# SPDX-License-Identifier: Apache-2.0
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dynatrace-self-monitoring
  labels:
    {{- include "dynatrace-operator.selfMonitoringLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dynatrace-self-monitoring
  labels:
    {{- include "dynatrace-operator.selfMonitoringLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dynatrace-self-monitoring
subjects:
  - kind: ServiceAccount
    name: dynatrace-self-monitoring
    namespace: {{ .Release.Namespace }}
{{ end }}
