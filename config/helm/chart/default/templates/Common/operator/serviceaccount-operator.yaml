apiVersion: v1
kind: ServiceAccount
metadata:
  name: dynatrace-operator
  namespace: {{ .Release.Namespace }}
  {{- if .Values.rbac.operator.annotations }}
  annotations:
    {{- toYaml .Values.rbac.operator.annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "dynatrace-operator.operatorLabels" . | nindent 4 }}
