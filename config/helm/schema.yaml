 registered by @aorcholski in https://github.com/Dynatrace/dynatrace-operator/pull/6740\n* Add check for stale network-zone AG Service IPs by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6738\n* Bump dynatrace-bootstrapper version to 1.4.1 by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6781\n* Disable OTELC probes when EEC and prometheus is enabled by @avorima in https://github.com/Dynatrace/dynatrace-operator/pull/6815\n* Always read token secret for validation by @avorima in https://github.com/Dynatrace/dynatrace-operator/pull/6928\n* Fix OA DaemonSet secret mount permissions. (#6974) by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6975\n* Do not use `timeprovider.Provider` in the version reconciler by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6970\n* Add missing license headers by @gkrenn in https://github.com/Dynatrace/dynatrace-operator/pull/7016\n* Fix webhook CrashLoopBackOff on gVisor nodes by @waodim in https://github.com/Dynatrace/dynatrace-operator/pull/7017\n* Delete replicated secrets on namespace deselection by @Incredible-O in https://github.com/Dynatrace/dynatrace-operator/pull/7047\n* Make init user/group configurable by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/7072\n* Report missing token scopes only once by @Incredible-O in https://github.com/Dynatrace/dynatrace-operator/pull/7199\n* Mount /etc/ld.so.preload readonly by @avorima in https://github.com/Dynatrace/dynatrace-operator/pull/7228\n* Fix mark-for-termination edge case by @gkrenn in https://github.com/Dynatrace/dynatrace-operator/pull/7321\n* Fix 'ImageHasBeenDownloaded' in e2e test by @gkrenn in https://github.com/Dynatrace/dynatrace-operator/pull/7517\n* Remove assertions from wait command by @gkrenn in https://github.com/Dynatrace/dynatrace-operator/pull/7547\n\n### Core changes \U0001F389\n* Reduce automated pull request branch name length by @avorima with @Copilot in https://github.com/Dynatrace/dynatrace-operator/pull/6345\n* Reduce permissions on readonly mounted files by @aorcholski in https://github.com/Dynatrace/dynatrace-operator/pull/6292\n* Clean up bundle images by @avorima in https://github.com/Dynatrace/dynatrace-operator/pull/6346\n* ci: Replace python scripts with bash by @avorima in https://github.com/Dynatrace/dynatrace-operator/pull/6360\n* chore(deps): update aquasecurity/trivy-action action to v0.35.0 (main) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6366\n* [Automatic] Update because new branch created release-1.9 by @operator-bot-account[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6357\n* add olm e2e test by @andriisoldatenko in https://github.com/Dynatrace/dynatrace-operator/pull/6335\n* add prerequisites/operator-sdk to bundle/run by @andriisoldatenko in https://github.com/Dynatrace/dynatrace-operator/pull/6384\n* chore(deps): update zizmorcore/zizmor-action action to v0.5.2 (main) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6362\n* Fix issues with create marketplace forks action by @s-quatres in https://github.com/Dynatrace/dynatrace-operator/pull/6383\n* Fix preflight CI step by @Incredible-O in https://github.com/Dynatrace/dynatrace-operator/pull/6392\n* add OLM tests to ondemand pipeline by @andriisoldatenko in https://github.com/Dynatrace/dynatrace-operator/pull/6391\n* Consider helm/go files changes in build/push/olm [ICP-1145] by @andriisoldatenko in https://github.com/Dynatrace/dynatrace-operator/pull/6415\n* ci: added sync-openapi-schema workflow by @svfoxat in https://github.com/Dynatrace/dynatrace-operator/pull/6375\n* Bump golang.org/x/net dependency to fix CVE by @avorima in https://github.com/Dynatrace/dynatrace-operator/pull/6424\n* Reject non-DNS1035 DynaKube names in the CSI driver by @Incredible-O in https://github.com/Dynatrace/dynatrace-operator/pull/6426\n* feat: generating go clients for openapi schemas by @svfoxat in https:/