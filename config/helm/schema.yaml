x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: 1.10.3
  publishedVersionMetadata:
    releaseNote: "<!-- Release notes generated using configuration in .github/release.yml at v1.10.3 -->\n\n## What's Changed\n\n### Bugfixes \U0001FAB2\n* Bump dynatrace-bootstrapper to v1.4.3 by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6888\n* Do not create/attach tenant pull-secret when public-registry FF is used by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6926\n* Fix pull-secret helper by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6936\n* Add resources for OA DS init container by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6947\n* Fix OA DaemonSet secret mount permissions. by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6974\n* Do not use `timeprovider.Freeze()` in live code. by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6971\n* Fix OA communication host handling by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6983\n* Fix order of precedence for enrichment rules by @avorima in https://github.com/Dynatrace/dynatrace-operator/pull/7025\n* Set the Dynatrace Client connection timeout to 15 min by @aorcholski in https://github.com/Dynatrace/dynatrace-operator/pull/7068\n* Backport of 'Fix cleanup of still used code modules' by @gkrenn in https://github.com/Dynatrace/dynatrace-operator/pull/7512\n\n### Core changes \U0001F389\n* Update GitHub Actions (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6869\n* Update zizmorcore/zizmor-action action to v0.5.7 (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6894\n* Update GitHub Actions (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6899\n* cherry-pick: dk validator: decrease max sts name const -1 due to edge case by @andriisoldatenko in https://github.com/Dynatrace/dynatrace-operator/pull/6901\n* Update GitHub Actions (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6906\n* Update dependency helm/helm to v4.2.3 (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6954\n* Update GitHub Actions (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6955\n* Update GitHub Actions (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6962\n* Update softprops/action-gh-release action to v3.0.2 (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6980\n* Fix update-csv-bundles: scoped git restore, missing deploy manifests, and CSV description updates by @waodim in https://github.com/Dynatrace/dynatrace-operator/pull/6985\n* Fix create-marketplaces-forks: workflows push rejection, missing Dockerfile, and wrong spec.replaces by @waodim in https://github.com/Dynatrace/dynatrace-operator/pull/6986\n* Update Dev tooling (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7005\n* Update aws-actions/configure-aws-credentials action to v6.2.3 (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7036\n* Update ossf/scorecard-action action to v2.4.4 (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7038\n* Fix automated CSV bundle update to use GitHub-generated changelog (#7018) by @waodim in https://github.com/Dynatrace/dynatrace-operator/pull/7041\n* Update Dev tooling (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7252\n* Update dependency helm to v3.21.4 (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7265\n* [release-1.10] fix: use golang version from Dockerfile for actions/setup-go by @jokuniew in https://github.com/Dynatrace/dynatrace-operator/pull/7341\n* Update Dev tooling (release-1.10) by @renovate[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7294\n* chore: update github actions (release-1.10) by @dynatrace-llc-renovate-operator[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7363\n* chore: update dependency redhat-openshift-ecosystem/openshift-preflight to v1.21.1 (release-1.10) by @dynatrace-llc-renovate-operator[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7510\n* chore: update oras-project/setup-oras action to v2.0.2 (release-1.10) by @dynatrace-llc-renovate-operator[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7545\n* chore: update actions/upload-artifact action to v7.0.2 (release-1.10) by @dynatrace-llc-renovate-operator[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7588\n\n### Helm changes ⛑️\n* Remove `oneAgentInitResources` reuse `oneAgentResources` instead by @0sewa0 in https://github.com/Dynatrace/dynatrace-operator/pull/6958\n* [Automatic] Update OLM CSV bundles for v1.10.0 by @operator-bot-account[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/6965\n* Remove outdated maintainers (#6989) by @mihaitanasedt in https://github.com/Dynatrace/dynatrace-operator/pull/7000\n* [Automatic] Update OLM CSV bundles for v1.10.1 by @operator-bot-account[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7011\n* Fix webhook CrashLoopBackOff on gVisor nodes (#7017) by @waodim in https://github.com/Dynatrace/dynatrace-operator/pull/7040\n* Fix operator deadlock on OpenShift manifest-based install by @waodim in https://github.com/Dynatrace/dynatrace-operator/pull/7042\n* [Automatic] Update OLM CSV bundles for v1.10.2 by @operator-bot-account[bot] in https://github.com/Dynatrace/dynatrace-operator/pull/7103\n* bump controller-runtime & k8s ecosystem to pass snyk scan (release-1.10) by @jokuniew in https://github.com/Dynatrace/dynatrace-operator/pull/7516\n\n### Component changes \U0001F6E0️\n* Set permissions of dynakube-internal-proxy files to 0o640 (release-1.10) by @aorcholski in https://github.com/Dynatrace/dynatrace-operator/pull/6959\n\n\n**Full Changelog**: https://github.com/Dynatrace/dynatrace-operator/compare/v1.11.0...v1.10.3\n"
    releaseTypes:
      - Feature
    recommended: true
  managedUpdates:
    kalmSupported: true
  images:
    '':
      properties:
        image:
          type: FULL
  deployerServiceAccount:
    description: 'Service account used to configure the Dynatrace Operator'
    roles:
      - type: ClusterRole
        rulesType: CUSTOM
        rules:
          - apiGroups:
              - admissionregistration.k8s.io
            resources:
              - mutatingwebhookconfigurations
            verbs:
              - get
              - create
              - list
              - patch
          - apiGroups:
              - dynatrace.com
            resources:
              - dynakubes
            verbs:
              - get
              - list
              - create
              - patch
          - apiGroups:
              - apiextensions.k8s.io
            resources:
              - customresourcedefinitions
            verbs:
              - get
              - list
              - create
              - patch
          - apiGroups:
              - dynatrace.com
            resources:
              - dynakubes
            verbs:
              - get
              - list
              - watch
              - update
              - patch
          - apiGroups:
              - app.k8s.io
            resources:
              - applications
            verbs:
              - get
              - list
          - apiGroups:
              - storage.k8s.io
            resources:
              - csidrivers
            verbs:
              - '*'
          - apiGroups:
              - ''
            resources:
              - services
              - serviceaccounts
            verbs:
              - '*'
          - apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - role
              - rolebinding
              - clusterroles
              - clusterrolebindings
            verbs:
              - '*'
          - apiGroups:
              - admissionregistration.k8s.io
            resources:
              - validatingwebhookconfigurations
            verbs:
              - '*'
          - apiGroups:
              - scheduling.k8s.io
            resources:
              - priorityclasses
            verbs:
              - get
              - create
              - patch
properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE
    default: dynatrace
  deployerHelm.image:
    type: string
    x-google-marketplace:
      type: DEPLOYER_IMAGE
  customPullSecret:
    type: string
    title: Custom pull secret
    description: If the Operator image is in a private registry, the name of the appropriate pull secret can be set here
    default: ""
  imageRef.pullPolicy:
    type: string
    title: Operator image pull policy
    description: Overrite the default image pull policy for the operator.
    default: ""
    enum:
      - IfNotPresent
      - Always
      - Never
  operator.apparmor:
    type: boolean
    title: Enables AppArmor for Operator
    description: |
      AppArmor is a security system for Linux.
      If a cluster supports AppArmor the Operator uses it if it is enabled here.
      If it is not supported by a cluster it must not be enabled.
    default: false
  operator.requests.cpu:
    type: string
    title: Operator CPU request
    description: The amount of CPU allocation the Operator requests from the cluster.
    default: 50m
  operator.requests.memory:
    type: string
    title: Operator Memory request
    description: The amount of memory allocation the Operator requests from the cluster.
    default: 64Mi
  operator.limits.cpu:
    type: string
    title: Operator  CPU limit
    description: The amount of CPU allocation to which the cluster may limit the Operator.
    default: 100m
  operator.limits.memory:
    type: string
    title: Operator Memory limit
    description: The amount of memory allocation to which the cluster may limit the Operator.
    default: 128Mi
  operator.startupProbe.periodSeconds:
    type: integer
    title: Operator startup probe periodSeconds
    description: How often (in seconds) to perform the startup probe. Defaults to 10.
  operator.startupProbe.timeoutSeconds:
    type: integer
    title: Operator startup probe timeoutSeconds
    description: Number of seconds after which the startup probe times out. Defaults to 5.
  operator.startupProbe.failureThreshold:
    type: integer
    title: Operator startup probe failureThreshold
    description: Number of times the startup probe can fail before giving up. Defaults to 1.
  webhook.hostNetwork:
    type: boolean
    title: Webhook uses Host network
    description: |
      Allows the webhook to connect with and use the same network as the node.
      May alleviate issues with container network interfaces (CNI).
    default: false
  webhook.apparmor:
    type: boolean
    title: Enables AppArmor for Webhook
    description: |
      AppArmor is a security system for Linux.
      If a cluster supports AppArmor the Webhook uses it if it is enabled here.
      If it is not supported by a cluster it must not be enabled.
    default: false
  webhook.requests.cpu:
    type: string
    title: Webhook CPU request
    description: |
      The amount of CPU allocation the Webhook requests from the cluster.
      It is recommended for the CPU requests to be the same as the CPU limits.
    default: 300m
  webhook.requests.memory:
    type: string
    title: Webhook Memory request
    description: |
      The amount of memory allocation the Webhook requests from the cluster.
      It is recommended for the memory requests to be the same as the memory limits.
    default: 128Mi
  webhook.limits.cpu:
    type: string
    title: Webhook CPU limit
    description: |
      The amount of CPU allocation to which the cluster may limit the Webhook.
      It is recommended for the CPU limits to be the same as the CPU requests.
    default: 300m
  webhook.limits.memory:
    type: string
    title: Webhook Memory limit
    description: |
      The amount of memory allocation to which the cluster may limit the Webhook.
      It is recommended for the memory limits to be the same as the memory requests.
    default: 128Mi
  webhook.highAvailability:
    type: boolean
    title: (DEPRECATED) Enable Webhook's high availability mode
    description: (DEPRECATED) Increases replicas and adds topology constraints for the Webhook.
    default: false
  webhook.replicas:
    type: integer
    title: Webhook replicas
    description: |
      The number of replicas for the Webhook.
      Only used if webhook.highAvailability is set to true.
    default: 2
  webhook.podDisruptionBudget.minAvailable:
    type: integer
    title: Webhook Pod Disruption Budget minAvailable
    description: |
      The minimum number of available replicas for the Webhook.
      Only used if webhook.highAvailability is set to true.
    default: 1
  webhook.startupProbe.periodSeconds:
    type: integer
    title: Webhook startup probe periodSeconds
    description: How often (in seconds) to perform the startup probe. Defaults to 10.
  webhook.startupProbe.timeoutSeconds:
    type: integer
    title: Webhook startup probe timeoutSeconds
    description: Number of seconds after which the startup probe times out. Defaults to 5.
  webhook.startupProbe.failureThreshold:
    type: integer
    title: Webhook startup probe failureThreshold
    description: Number of times the startup probe can fail before giving up. Defaults to 1.
  csidriver.enabled:
    type: boolean
    title: Enables CSI driver
    description: The CloudNativeFullStack as well as AppOnly mode need the CSI driver to function properly.
    default: false
  csidriver.apparmor:
    type: boolean
    title: Enables AppArmor for CSI driver
    description: |
      AppArmor is a security system for Linux.
      If a cluster supports AppArmor the CSI driver uses it if it is enabled here.
      If it is not supported by a cluster it must not be enabled.
    default: false
  csidriver.provisioner.resources.requests.cpu:
    type: string
    title: CSI driver CPU request - provisioner
    description: |
      The amount of CPU allocation the CSI driver requests from the cluster.
      It is recommended for the CPU requests to be the same as the CPU limits.
    default: 300m
  csidriver.provisioner.resources.requests.memory:
    type: string
    title: CSI driver Memory request - provisioner
    description: |
      The amount of memory allocation the CSI driver requests from the cluster.
      It is recommended for the memory requests to be the same as the memory limits.
    default: 100Mi
  csidriver.provisioner.startupProbe.periodSeconds:
    type: integer
    title: CSI driver provisioner startup probe periodSeconds
    description: How often (in seconds) to perform the startup probe. Defaults to 10.
  csidriver.provisioner.startupProbe.timeoutSeconds:
    type: integer
    title: CSI driver provisioner startup probe timeoutSeconds
    description: Number of seconds after which the startup probe times out. Defaults to 5.
  csidriver.provisioner.startupProbe.failureThreshold:
    type: integer
    title: CSI driver provisioner startup probe failureThreshold
    description: Number of times the startup probe can fail before giving up. Defaults to 1.
  csidriver.server.resources.requests.cpu:
    type: string
    title: CSI driver CPU request - server
    description: |
      The amount of CPU allocation the CSI driver requests from the cluster.
      It is recommended for the CPU requests to be the same as the CPU limits.
    default: 50m
  csidriver.server.resources.requests.memory:
    type: string
    title: CSI driver Memory request - server
    description: |
      The amount of memory allocation the CSI driver requests from the cluster.
      It is recommended for the memory requests to be the same as the memory limits.
    default: 100Mi
  csidriver.server.resources.limits.cpu:
    type: string
    title: CSI driver CPU limit - server
    description: |
      The amount of CPU allocation to which the cluster may limit the CSI driver.
      It is recommended for the CPU limits to be the same as the CPU requests.
    default: 50m
  csidriver.server.resources.limits.memory:
    type: string
    title: CSI driver Memory limit - server
    description: |
      The amount of memory allocation to which the cluster may limit the CSI driver.
      It is recommended for the memory limits to be the same as the memory requests.
    default: 100Mi
  csidriver.registrar.resources.requests.cpu:
    type: string
    title: CSI driver CPU request - registrar
    description: |
      The amount of CPU allocation the CSI driver requests from the cluster.
      It is recommended for the CPU requests to be the same as the CPU limits.
    default: 20m
  csidriver.registrar.resources.requests.memory:
    type: string
    title: CSI driver Memory request - registrar
    description: |
      The amount of memory allocation the CSI driver requests from the cluster.
      It is recommended for the memory requests to be the same as the memory limits.
    default: 30Mi
  csidriver.registrar.resources.limits.cpu:
    type: string
    title: CSI driver CPU limit - registrar
    description: |
      The amount of CPU allocation to which the cluster may limit the CSI driver.
      It is recommended for the CPU limits to be the same as the CPU requests.
    default: 20m
  csidriver.registrar.resources.limits.memory:
    type: string
    title: CSI driver Memory limit - registrar
    description: |
      The amount of memory allocation to which the cluster may limit the CSI driver.
      It is recommended for the memory limits to be the same as the memory requests.
    default: 30Mi
  csidriver.livenessprobe.resources.requests.cpu:
    type: string
    title: CSI driver CPU request - livenessprobe
    description: |
      The amount of CPU allocation the CSI driver requests from the cluster.
      It is recommended for the CPU requests to be the same as the CPU limits.
    default: 20m
  csidriver.livenessprobe.resources.requests.memory:
    type: string
    title: CSI driver Memory request - livenessprobe
    description: |
      The amount of memory allocation the CSI driver requests from the cluster.
      It is recommended for the memory requests to be the same as the memory limits.
    default: 30Mi
  csidriver.livenessprobe.resources.limits.cpu:
    type: string
    title: CSI driver CPU limit - livenessprobe
    description: |
      The amount of CPU allocation to which the cluster may limit the CSI driver.
      It is recommended for the CPU limits to be the same as the CPU requests.
    default: 20m
  csidriver.livenessprobe.resources.limits.memory:
    type: string
    title: CSI driver Memory limit - livenessprobe
    description: |
      The amount of memory allocation to which the cluster may limit the CSI driver.
      It is recommended for the memory limits to be the same as the memory requests.
    default: 30Mi
  activeGate.readOnlyFs:
    type: boolean
    title: Mount filesystem in read-only mode
    description: Restricts ActiveGate deployments to mount filesystems read-only.
    default: false
  installCRD:
    type: boolean
    title: Install DynaKube CRD
    description: |
      Tells the Helm chart of the deployer to install the custom resource definition (CRD) of the DynaKube API.
    default: true
    enum:
      - true
  platform:
    type: string
    title: Platform
    description: |
      Platform to deploy on.
      Must be set to "google-marketplace" for GKE clusters.
    default: google-marketplace
    enum:
      - "google-marketplace"
  crdStorageMigrationJob:
    type: boolean
    title: Deploy helm hook
    default: false
    enum:
      - false
required:
  - name
  - namespace
