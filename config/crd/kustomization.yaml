resources:
- bases
#+kubebuilder:scaffold:crdkustomizeresource

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
- path: patches/webhook_in_dynakubes.yaml
- path: patches/webhook_in_edgeconnects.yaml
# PrometheusMonitoring is still gated behind the experimental.enablePrometheus Helm flag and is
# built separately in config/crd/prometheusmonitoring/ instead. Remove this delete-patch (and
# merge prometheusmonitoring back into this build normally) once that flag goes away.
- patch: |-
    $patch: delete
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: prometheusmonitorings.dynatrace.com
