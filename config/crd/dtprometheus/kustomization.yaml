# DTPrometheus is still gated behind the experimental.enablePrometheus Helm flag, so it
# is built separately from the other two CRDs (see config/crd/kustomization.yaml, which
# excludes it from the main build with a matching delete-patch). Remove this directory
# once that flag goes away, and merge dtprometheus back into the main build normally.
resources:
- ../bases
patches:
- patch: |-
    $patch: delete
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: dynakubes.dynatrace.com
- patch: |-
    $patch: delete
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: edgeconnects.dynatrace.com
