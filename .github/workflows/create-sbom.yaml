name: Create SBOM
on:
  workflow_call:
    inputs:
      sbom-artifact-name:
        description: name for the uploaded SBOM artifact
        required: true
        type: string
      image-artifact-name:
        description: name of the uploaded image artifact to scan locally
        required: true
        type: string
permissions:
  actions: write
jobs:
  create-sbom:
    runs-on: ubuntu-24.04
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.image-artifact-name }}
          path: image
      - name: Create SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: image/${{ inputs.image-artifact-name }}.tar
          format: 'cyclonedx'
          output: 'result.json'
          skip-dirs: '/usr/share/dynatrace-operator/third_party_licenses'
          skip-files: '/usr/local/bin/dynatrace-operator'
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.sbom-artifact-name }}
          path: result.json
          retention-days: 1
