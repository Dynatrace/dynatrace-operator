name: Nightly build

on:
  schedule:
    # every work day at 00:00 UTC
    - cron: 0 0 * * 1-5

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: dynatrace/dynatrace-operator
  PLATFORMS: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
  FIPS_PLATFORMS: linux/amd64,linux/arm64

jobs:
  prepare:
    if: github.repository_owner == 'Dynatrace'
    permissions:
      contents: read
    name: Prepare properties
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare build parameters
        id: prep
        run: |
          hack/build/ci/prepare-build-variables.sh
    outputs:
      version: ${{ steps.prep.outputs.docker_image_tag }}
      version_without_prefix: ${{ steps.prep.outputs.docker_image_tag_without_prefix }}

  build-push:
    if: github.repository_owner == 'Dynatrace'
    name: Build images
    needs: [prepare]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build-image
        uses: ./.github/actions/build-push-image
        with:
          platforms: ${{ env.PLATFORMS }}
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}

  build-push-fips:
    if: github.repository_owner == 'Dynatrace'
    name: Build FIPS image
    needs: [prepare]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build FIPS image
        id: build-fips-image
        uses: ./.github/actions/build-push-image
        with:
          platforms: ${{ env.FIPS_PLATFORMS }}
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          fips: true
          suffix: fips
    outputs:
      fips-digest: ${{ steps.build-fips-image.outputs.digest }}

  copy-image-to-artifact:
    if: github.repository_owner == 'Dynatrace'
    name: Create image artifacts
    environment: Release
    needs: [prepare, build-push]
    permissions:
      contents: read
      actions: write
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy image to artifact
        uses: ./.github/actions/copy-image-to-artifact
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}@${{ needs.build-push.outputs.digest }}
          artifact-name: nightly-image
          registry: ${{ env.IMAGE_REGISTRY }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.repository_owner }}

  copy-image-to-artifact-fips:
    if: github.repository_owner == 'Dynatrace'
    name: Create image artifacts
    environment: Release
    needs: [prepare, build-push-fips]
    permissions:
      contents: read
      actions: write
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy image to artifact
        uses: ./.github/actions/copy-image-to-artifact
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-fips@${{ needs.build-push-fips.outputs.fips-digest }}
          artifact-name: nightly-image-fips
          registry: ${{ env.IMAGE_REGISTRY }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.repository_owner }}

  create-sbom:
    if: github.repository_owner == 'Dynatrace'
    needs: [copy-image-to-artifact]
    permissions:
      actions: write
    uses: ./.github/workflows/create-sbom.yaml
    with:
      sbom-artifact-name:  nightly-sbom
      image-artifact-name: nightly-image

  create-sbom-fips:
    if: github.repository_owner == 'Dynatrace'
    needs: [copy-image-to-artifact-fips]
    permissions:
      actions: write
    uses: ./.github/workflows/create-sbom.yaml
    with:
      sbom-artifact-name:  nightly-sbom-fips
      image-artifact-name: nightly-image-fips

  signing:
    if: github.repository_owner == 'Dynatrace'
    name: Sign the image index/manifests + Add SBOM
    environment: Release
    needs: [prepare, build-push, build-push-fips, create-sbom, create-sbom-fips]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign image
        uses: ./.github/actions/sign-image
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}@${{ needs.build-push.outputs.digest }}
          signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          signing-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: Download SBOM artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-sbom
      - name: Upload SBOM
        uses: ./.github/actions/upload-sbom
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}@${{ needs.build-push.outputs.digest }}
          sbom: 'result.json'
          signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          signing-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: Add build provenance attestation
        uses: ./.github/actions/attest-artifact
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-push.outputs.digest }}
      - name: Sign FIPS image
        uses: ./.github/actions/sign-image
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-fips@${{ needs.build-push-fips.outputs.fips-digest }}
          signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          signing-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: Download FIPS SBOM artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-sbom-fips
      - name: Upload FIPS SBOM
        uses: ./.github/actions/upload-sbom
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-fips@${{ needs.build-push-fips.outputs.fips-digest }}
          sbom: 'result.json'
          signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          signing-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: Add FIPS build provenance attestation
        uses: ./.github/actions/attest-artifact
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-push-fips.outputs.fips-digest }}

  release:
    if: github.repository_owner == 'Dynatrace'
    name: Create release
    needs: [prepare, build-push, build-push-fips, signing]
    environment: Release
    permissions:
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    env:
      HELM_PACKAGE_VERSION: 0.0.0-${{ needs.prepare.outputs.version_without_prefix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable' # Latest stable version
          cache: false
      - name: Build helm packages
        uses: ./.github/actions/build-helm
        with:
          version_without_prefix: ${{ env.HELM_PACKAGE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          secring: ${{ secrets.HELM_SECRING }}
          passphrase: ${{ secrets.HELM_PASSPHRASE }}
          output-dir: "./helm-pkg"
      - name: Authenticate Helm
        shell: bash
        run: |
          helm registry login -u "${{ github.repository_owner }}" -p "${{ secrets.GITHUB_TOKEN }}" "${{ env.IMAGE_REGISTRY }}"
      - name: Authenticate Docker
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload and sign helm package
        uses: ./.github/actions/upload-nightly-helm
        with:
          version: ${{ needs.prepare.outputs.version }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
          registry-url: ghcr.io
          registry-namespace: dynatrace
          helm-repository-name: dynatrace-operator
          image-tag-prefix: "0.0.0-"
          mutable-nightly-tag: "nightly-chart"
