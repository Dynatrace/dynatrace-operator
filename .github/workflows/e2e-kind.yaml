name: E2E tests on kind

on:
  issue_comment:
    types: [created]
  merge_group:
    types: [checks_requested]
  # pull_request only reports the gate as "skipped" (counts as pass) so the PR can enter the queue
  pull_request:

jobs:
  check-comment:
    name: Check for trigger comment
    if: github.event.issue.pull_request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      triggered: ${{ steps.check-comment.outputs.triggered }}
      detected-command: ${{ steps.check-comment.outputs.detected-command }}
      pr_branch: ${{ steps.check-comment.outputs.pr_branch }}
      pr_sha: ${{ steps.check-comment.outputs.pr_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check comment and get PR details
        id: check-comment
        uses: $/.github/actions/check-comment
        with:
          allowed-commands: '/run-e2e-kind'

  prepare:
    name: Prepare E2E test run
    needs: check-comment
    if: |
      !cancelled() &&
      ((needs.check-comment.outputs.triggered == 'true' && needs.check-comment.outputs.detected-command == '/run-e2e-kind') ||
       github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-comment.outputs.pr_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check and wait for image availability
        run: |
          IMAGE=dynatrace/dynatrace-operator
          TAG=snapshot-$(hack/build/ci/sanitize-branch-name.sh "${PR_BRANCH}")
          ./hack/build/ci/check-image-available.sh "$IMAGE" "$TAG"
        env:
          PR_BRANCH: ${{ needs.check-comment.outputs.pr_branch || github.ref_name }}
      - name: Comment with workflow link
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '🚀 E2E tests dispatched: `deploy`, `edgeconnect`, `kind`',
                '',
                `[View workflow run](${runUrl})`
              ].join('\n')
            });

  test:
    name: Run ${{ matrix.suite }} E2E tests
    needs: [check-comment, prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: E2E
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [deploy, edgeconnect, kind]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-comment.outputs.pr_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup up kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          # renovate datasource=github-releases depName=kubernetes-sigs/kind
          version: v0.33.0
          install_only: true

      - name: Get go version
        id: go-version
        uses: $/.github/actions/get-go-version

      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.go_version }}

      - name: Set up helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate datasource=github-releases depName=helm/helm
          version: v4.3.0

      - name: Store test tenant secrets
        run: |
          ./.github/scripts/prepare-e2e-secrets.sh
        env:
          TENANT1_APITOKEN: ${{ secrets.TENANT1_APITOKEN }}
          TENANT1_APITOKEN_NOSETTINGS: ${{ secrets.TENANT1_APITOKEN_NOSETTINGS }}
          TENANT1_DATAINGESTTOKEN: ${{ secrets.TENANT1_DATAINGESTTOKEN }}
          TENANT1_DATAINGEST_PLATFORM_TOKEN: ${{ secrets.TENANT1_DATAINGEST_PLATFORM_TOKEN }}
          TENANT1_NAME: ${{ secrets.TENANT1_NAME }}
          TENANT1_OAUTH_CLIENT_ID: ${{ secrets.TENANT1_OAUTH_CLIENT_ID }}
          TENANT1_OAUTH_SECRET: ${{ secrets.TENANT1_OAUTH_SECRET }}
          TENANT1_OAUTH_URN: ${{ secrets.TENANT1_OAUTH_URN }}
          TENANT1_PLATFORM_TOKEN: ${{ secrets.TENANT1_PLATFORM_TOKEN }}
          TENANT1_PLATFORM_TOKEN_NOSETTINGS: ${{ secrets.TENANT1_PLATFORM_TOKEN_NOSETTINGS }}
          TENANT2_APITOKEN: ${{ secrets.TENANT2_APITOKEN }}
          TENANT2_DATAINGESTTOKEN: ${{ secrets.TENANT2_DATAINGESTTOKEN }}
          TENANT2_NAME: ${{ secrets.TENANT2_NAME }}
          TENANT2_PLATFORM_TOKEN: ${{ secrets.TENANT2_PLATFORM_TOKEN }}
          TENANT3_PHASE3_APITOKEN: ${{ secrets.TENANT3_PHASE3_APITOKEN }}
          TENANT3_PHASE3_DATAINGESTTOKEN: ${{ secrets.TENANT3_PHASE3_DATAINGESTTOKEN }}
          TENANT3_PHASE3_DATAINGEST_PLATFORM_TOKEN: ${{ secrets.TENANT3_PHASE3_DATAINGEST_PLATFORM_TOKEN }}
          TENANT3_PHASE3_NAME: ${{ secrets.TENANT3_PHASE3_NAME }}
          TENANT3_PHASE3_OAUTH_CLIENT_ID: ${{ secrets.TENANT3_PHASE3_OAUTH_CLIENT_ID }}
          TENANT3_PHASE3_OAUTH_SECRET: ${{ secrets.TENANT3_PHASE3_OAUTH_SECRET }}
          TENANT3_PHASE3_OAUTH_URN: ${{ secrets.TENANT3_PHASE3_OAUTH_URN }}
          TENANT3_PHASE3_PLATFORM_TOKEN: ${{ secrets.TENANT3_PHASE3_PLATFORM_TOKEN }}
          TENANT3_PHASE3_PLATFORM_TOKEN_NOSETTINGS: ${{ secrets.TENANT3_PHASE3_PLATFORM_TOKEN_NOSETTINGS }}
          TENANT4_PHASE3_NAME: ${{ secrets.TENANT4_PHASE3_NAME }}
          TENANT4_PHASE3_PLATFORM_TOKEN: ${{ secrets.TENANT4_PHASE3_PLATFORM_TOKEN }}

      - name: Start kind cluster
        run: |
          # We use the startup script instead of the kind-action to start the cluster to be able to pin the k8s version
          make kind/setup
          kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s

      - name: Run ${{ matrix.suite }} tests
        id: run-e2e
        run: make test/e2e/$SUITE
        env:
          SUITE: ${{ matrix.suite }}
          BRANCH: ${{ needs.check-comment.outputs.pr_branch || github.ref_name }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.suite }}-results
          path: results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup kind cluster
        if: always()
        run: |
          kind delete cluster --name kind || true

  report:
    name: Report E2E test results
    needs: [prepare, test]
    if: ${{ !cancelled() && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment result on PR
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const success = '${{ needs.test.result }}' === 'success';
            const emoji = success ? '✅' : '❌';
            const status = success ? 'SUCCESS' : 'FAILED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `${emoji} E2E tests: **${status}**`,
                '',
                `[View workflow run](${runUrl})`
              ].join('\n')
            });

      - name: Fail if any suite did not succeed
        if: needs.test.result != 'success'
        run: |
          echo "Matrix result: ${{ needs.test.result }}"
          exit 1
