apiVersion: v1
kind: Pod
metadata:
  labels:
    app: nginx-sample
  name: nginx-sample
spec:
  containers:
    - image: docker.io/nginx:1.31.3
      name: app
      resources:
        requests:
          memory: 64Mi
          ephemeral-storage: 2Gi
        limits:
          memory: 128Mi
          ephemeral-storage: 2Gi
  restartPolicy: Always
  securityContext:
    runAsUser: 0
    runAsGroup: 0
